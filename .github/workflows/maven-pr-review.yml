name: Automated Code Review (Bài 7)

# Kích hoạt trên nhánh main khi có Push hoặc Pull Request
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Cấp quyền cho Bot được phép viết bình luận (comment) vào Pull Request
permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build-and-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'oracle'
          cache: 'maven'

      # Chạy kiểm tra Checkstyle bằng Maven
      - name: Run Checkstyle
        run: mvn -B clean checkstyle:check

      # Đọc file checkstyle-result.xml và tự động bình luận vào PR
      - name: Inline Checkstyle Feedback
        if: always() # Luôn chạy bước này kể cả khi Checkstyle báo lỗi
        uses: jwgmeligmeyling/checkstyle-github-action@master
        with:
          path: '**/checkstyle-result.xml'